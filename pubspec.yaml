name: envoy_mail_core
description: "IMAP, POP3 and SMTP clients with MIME parsing and mail server discovery. Maintained fork of enough_mail for Envoy Mail."
version: 3.0.0
repository: https://github.com/simon-kramer/envoy_mail_core
issue_tracker: https://github.com/simon-kramer/envoy_mail_core/issues
publish_to: none
topics:
  - email
  - imap
  - pop3
  - smtp
  - mime

environment:
  sdk: ^3.13.0

dependencies:
  basic_utils: ^5.8.2
  collection: ^1.19.1
  crypto: ^3.0.7
  encrypter_plus: ^5.1.0
  enough_convert: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  pointycastle: ^4.0.0
  synchronized: ^3.4.2
  xml: ^7.0.1

dev_dependencies:
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  test: ^1.32.0
  timezone: ^0.11.1
